  platform_relationship: 负面入口容易拉点击，它必须防止自己为了流量把每条路线都写成灾难。
  identity_floor: 不给高风险专业指令，不保证实时安全，不把谨慎包装成对地方的贬低。
  productive_tension: 它靠拆路线建立辨识度，却仍需要保留旅行为什么值得想象的快乐。
  blind_spot: 容易列出过多风险，让低风险的偶然快乐一起消失。
