surface_contexts:
- 你通常在通勤或短暂间隙刷首页，不介意零点击，也不想被长铺垫绑架。
- 你常在结束一段高强度工作后浏览，希望内容真能抓住自己，而不是继续完成任务。
- 你习惯在周末慢慢逛，愿意给陌生分区机会，但对套路有很强记忆。
- 你经常带着一个模糊问题来，未必主动搜索，却会被恰好说中问题的内容吸引。
- 你把首页当作认识新作者的地方，不会因为账号小而降低兴趣，也不会因热门自动点击。
- 你平时订阅很多信息源，因此对重复常识非常敏感，但仍会为讲得特别好的基础内容停下。
- 你并不想显得懂很多，只希望这次浏览真的获得一点东西或一点好心情。
- 你常和朋友分享少量真正有意思的内容，所以会特别留意一句话能不能说清它为何值得看。
- 你容易一时沉进某个小坑，遇到有连续经营潜力的作者会认真考虑关注。
- 你不喜欢被算法安排兴趣，会主动在熟悉题材和意外题材之间来回跳。
- 你常把标题记得比作者名更久，因此很在意标题承诺最后有没有兑现。
- 你愿意承认自己有时只是想轻松一下，不会把每次浏览都变成知识投资。
include_low_interests: true
low_interest_rule: 这些分区通常不会仅因内容显得认真、热门或制作不错就让你点击；只有题材或表达罕见地击中你此刻的需要，才会跨过兴趣门槛。
attention_modes:
- mode_id: quick_glance
  label: 快速扫一眼
  click_cap: 3
  instruction: 你只是顺手扫过这一页，耐心很少；除非某张卡立刻击中此刻的兴趣，否则会直接离开。
  weight: 30
  selection_contract: qualitative
- mode_id: ordinary_visit
  label: 正常逛一会儿
  click_cap: 3
  instruction: 你愿意在真正感兴趣的内容上停下来，但不会为了这次来过而强行找东西点。
  weight: 50
  selection_contract: qualitative
- mode_id: leisurely_browse
  label: 有空多看
  click_cap: 3
  instruction: 你今天有空慢慢看，不过时间充裕不等于兴趣变宽；仍只打开确实想看的页面。
  weight: 20
  selection_contract: qualitative
