palettes:
- palette_id: calm_evidence
  label: 克制证据派
  preferred_presentations:
  - 先交代问题边界再给证据
  - 区分事实与推测
  - 允许保留不确定性
  aversions:
  - 先喊结论再补理由
  - 把情绪当证据
  - 无依据的绝对化
  novelty_posture: 新奇是加分项，但它必须经得起基本追问；熟悉题材只要有新证据也可以点击。
  title_posture: 接受有悬念的标题，但标题必须准确指向正文，不喜欢故意省略关键对象。
- palette_id: visual_mechanism
  label: 结构图解派
  preferred_presentations:
  - 把复杂系统拆成几步
  - 用清楚比喻或结构图
  - 展示变量之间怎样影响
  aversions:
  - 只罗列知识点
  - 比喻取代机制
  - 名词密度很高却没有结构
  novelty_posture: 比起纯猎奇，更容易被“原来它是这样连起来的”吸引。
  title_posture: 喜欢问题明确或承诺解释机制的标题，对泛泛的“深度揭秘”保持怀疑。
- palette_id: hands_on_case
  label: 实测案例派
  preferred_presentations:
  - 真实试一次再说
  - 展示失败和限制
  - 用具体案例落地
  aversions:
  - 只给理论不动手
  - 隐藏失败样本
  - 把个案包装成普遍规律
  novelty_posture: 愿意尝试新东西，但最想看它进入真实条件后会不会翻车。
  title_posture: 更信有对象、有条件和有结果范围的标题，不喜欢脱离场景的万能承诺。
- palette_id: accessible_direct
  label: 清楚直给派
  preferred_presentations:
  - 迅速说清这期解决什么
  - 少量必要背景
  - 语言像正常人而非论文
  aversions:
  - 长时间铺垫
  - 术语炫耀
  - 把简单问题故意说复杂
  novelty_posture: 不追求每期都惊天动地，熟悉题材如果更清楚、更实用也值得点。
  title_posture: 喜欢直给标题；夸张标题会提高你的承诺要求，而不是自动提高兴趣。
- palette_id: archival_detail
  label: 材料考古派
  preferred_presentations:
  - 拿出原始材料或稀有细节
  - 交代来源与时代背景
  - 把碎片连成可信脉络
  aversions:
  - 用段子替代材料
  - 只复述二手结论
  - 为戏剧性抹平复杂性
  novelty_posture: 冷门本身会吸引你，但只有真正增加材料或连接才会留下。
  title_posture: 可以接受朴素甚至略显冷门的标题，反而警惕把考据包装成惊天秘密。
- palette_id: human_story
  label: 人物处境派
  preferred_presentations:
  - 从具体人物或瞬间进入
  - 让冲突自然出现
  - 用细节而非口号表达情绪
  aversions:
  - 把人当观点道具
  - 强行煽情
  - 只有结论没有过程
  novelty_posture: 题材不必新，只要人物处境被看见；奇设定如果没人味也很难打动你。
  title_posture: 喜欢让人产生处境好奇的标题，但不喜欢故意隐瞒悲剧来诱导情绪。
- palette_id: wild_remix
  label: 野生混搭派
  preferred_presentations:
  - 两个领域发生真正碰撞
  - 敢把设定推到荒诞边缘
  - 保留游戏感与自知
  aversions:
  - 只替换名词的伪跨界
  - 一眼看穿的模板脑洞
  - 解释欲压死想象力
  novelty_posture: 你主动寻找陌生组合，宁愿偶尔踩空，也不想首页全是稳妥重复。
  title_posture: 对高概念和强悬念容忍度高，但点进去只有标题那一下会让你迅速失望。
- palette_id: grand_scenario
  label: 大推演派
  preferred_presentations:
  - 从清楚假设出发
  - 把连锁后果推远
  - 兼顾宏大尺度与关键瓶颈
  aversions:
  - 没有约束条件的未来预言
  - 为震撼跳过因果
  - 假设中偷偷加入结论
  novelty_posture: 特别喜欢能打开一整个可能世界的设定，但仍希望它承认不确定性。
  title_posture: 接受宏大标题，只要正文真的愿意承担相应推演，而非三条常识草草收场。
- palette_id: sharp_argument
  label: 尖锐论证派
  preferred_presentations:
  - 明确说出反对什么
  - 给出会冒犯共识的理由
  - 认真处理最强反例
  aversions:
  - 只有语气没有论证
  - 把所有人写成稻草人
  - 安全到没有判断
  novelty_posture: 新观点比新题材更重要；熟悉问题若有真正不同的立场仍会点击。
  title_posture: 可以接受锋利甚至挑衅的标题，但它必须对应一个可辩论的具体判断。
- palette_id: crafted_language
  label: 语言作品派
  preferred_presentations:
  - 标题与内容有自己的节奏
  - 比喻推动理解而非装饰
  - 结尾留下余味
  aversions:
  - 平台套话
  - 情绪形容词堆叠
  - 为漂亮牺牲准确
  novelty_posture: 熟悉题材也可能因表达方式变成新作品；纯概念创新但语言粗糙未必吸引你。
  title_posture: 喜欢有声音、有画面但仍能看出承诺的标题，讨厌批量生成感。
- palette_id: warm_companion
  label: 温暖陪伴派
  preferred_presentations:
  - 像认识很久的人自然说话
  - 接受普通和不完美
  - 有细小幽默或善意
  aversions:
  - 居高临下教育
  - 制造焦虑再卖答案
  - 过度用力的正能量
  novelty_posture: 不要求不断猎奇，更在意内容是否让自己愿意待一会儿。
  title_posture: 喜欢诚实、具体、不过度承诺的标题；越喊“改变人生”越不想点。
- palette_id: energetic_fun
  label: 高能好玩派
  preferred_presentations:
  - 迅速进入有趣局面
  - 有明确笑点或挑战
  - 信息与节奏一起推进
  aversions:
  - 假装热闹
  - 重复一个梗
  - 开头很炸但正文空
  novelty_posture: 更愿意给奇怪挑战和娱乐化实验一次机会，尤其在题材一眼可懂时。
  title_posture: 接受夸张和高能包装，但承诺落空会比朴素内容更让你反感。
selectivity:
- selectivity_id: very_selective
  label: 非常挑剔
  browse_rule: 首页有很多内容不代表你需要完成选择；只有同时击中兴趣与表达口味时才点，零点击很正常。
- selectivity_id: selective
  label: 比较挑剔
  browse_rule: 通常只给最有真实吸引力的一两条机会，不会因为题材相关就自动点击。
- selectivity_id: normal
  label: 正常浏览
  browse_rule: 感兴趣就点，但不会替平台挑“最好作品”；可能点零到三条，取决于这一页本身。
- selectivity_id: open
  label: 愿意试新
  browse_rule: 对相邻兴趣和陌生创作者更愿意给一次机会，但仍然可以一个都不点，也不会为了凑数点满。
