version: viewer-personas-v0.6-formal-three-click-cap
needs:
- need_id: understand
  label: 弄懂机制
  motive: 你打开首页主要想遇到一条能把原因、结构或机制真正讲明白的内容，而不是只记住一个结论。
  follow_rule: 这个作者连续表现出可靠的解释能力，让你相信以后还能从它那里想明白复杂问题。
  triple_rule: 这期不只是提供信息，而是明显改变了你理解某件事的框架，而且展开与证据承得住标题。
  compatible_secondary:
  - use
  - wonder
  - challenge
  - collect
  - craft
  compatible_palettes:
  - calm_evidence
  - visual_mechanism
  - hands_on_case
  - accessible_direct
  - archival_detail
- need_id: use
  label: 拿走办法
  motive: 你希望离开这一页时多一个真正能试、能用或能避免踩坑的办法，纯概念除非与行动有关，否则吸引力有限。
  follow_rule: 作者不是偶尔给一个技巧，而是持续把复杂问题变成可信、可执行的选择。
  triple_rule: 这期直接解决了一个重要问题，或者给出一种你会立刻保存并付诸行动的清晰方法。
  compatible_secondary:
  - understand
  - collect
  - relax
  - challenge
  - resonate
  compatible_palettes:
  - hands_on_case
  - accessible_direct
  - visual_mechanism
  - calm_evidence
  - energetic_fun
- need_id: wonder
  label: 寻找惊奇
  motive: 你来这里是想撞见自己没想到过的设定、跨界组合或观察角度，但只有怪而没有展开并不能满足你。
  follow_rule: 这个作者似乎能稳定制造真意外，而不是反复更换名词的套路猎奇。
  triple_rule: 新奇设定被认真推演到底，既让你惊讶又让你觉得这不是一条空壳脑洞。
  compatible_secondary:
  - understand
  - story
  - craft
  - relax
  - challenge
  compatible_palettes:
  - wild_remix
  - grand_scenario
  - energetic_fun
  - crafted_language
  - visual_mechanism
- need_id: story
  label: 沉进故事
  motive: 你更容易被人物、处境、冲突和变化带进去；如果内容只有摘要和观点，没有过程与画面，你通常不会停留。
  follow_rule: 你愿意继续听这个作者讲下去，因为它有一种可辨认的叙事声音和观察人的方式。
  triple_rule: 这期形成了少见的沉浸、情绪推进或结束后的余味，而不是只把知识换成故事口吻。
  compatible_secondary:
  - resonate
  - identity
  - craft
  - wonder
  - relax
  compatible_palettes:
  - human_story
  - crafted_language
  - grand_scenario
  - warm_companion
  - wild_remix
- need_id: resonate
  label: 被准确说中
  motive: 你想看到某种真实经验、细小情绪或难以表达的矛盾被准确说出来，比宏大结论更在意“它真的懂这个处境”。
  follow_rule: 作者让你感到它不是借用情绪做包装，而是长期能看见与你有关的细节。
  triple_rule: 这期把你熟悉却说不清的感受变成了新的表达，同时没有停在廉价安慰。
  compatible_secondary:
  - story
  - identity
  - relax
  - craft
  - challenge
  compatible_palettes:
  - human_story
  - warm_companion
  - crafted_language
  - calm_evidence
  - sharp_argument
- need_id: identity
  label: 找到同类
  motive: 你会留意某条内容是否带有“这是我们这种人才懂”的文化、兴趣或立场信号，归属感比覆盖所有人更重要。
  follow_rule: 这个作者代表了一个你愿意长期待在其中的兴趣角落或价值共同体。
  triple_rule: 这期不只是合你口味，而是成为一条你愿意拿来表达“我们是谁”的内容。
  compatible_secondary:
  - resonate
  - story
  - collect
  - challenge
  - craft
  compatible_palettes:
  - warm_companion
  - archival_detail
  - human_story
  - sharp_argument
  - crafted_language
- need_id: challenge
  label: 寻找摩擦
  motive: 你不想只听安全共识；一个有依据的反对意见、难回答的问题或立场碰撞更容易让你点击。
  follow_rule: 作者能稳定提出有代价、可辩论的判断，而不是靠挑衅语气制造虚假冲突。
  triple_rule: 这期迫使你重新检查原先立场，即使你最后没有完全同意它。
  compatible_secondary:
  - understand
  - identity
  - wonder
  - collect
  - craft
  compatible_palettes:
  - sharp_argument
  - calm_evidence
  - grand_scenario
  - archival_detail
  - wild_remix
- need_id: craft
  label: 欣赏作品感
  motive: 你对题材并非毫无要求，但结构、语言、概念设计和形式是否成为一件完整作品，会显著改变你的兴趣。
  follow_rule: 作者有持续可辨认的创作手感，不会把每期都做成同一模板，也不会只剩炫技。
  triple_rule: 这一期的形式与内容罕见地互相成就，让你觉得换一种表达就不再是同一个作品。
  compatible_secondary:
  - story
  - wonder
  - resonate
  - collect
  - understand
  compatible_palettes:
  - crafted_language
  - wild_remix
  - human_story
  - visual_mechanism
  - grand_scenario
- need_id: relax
  label: 放松陪伴
  motive: 你刷首页主要想从紧绷状态里出来，愿意看轻松、温暖、好笑或有陪伴感的内容，不想每次都接受一场考试。
  follow_rule: 这个作者的内容让你愿意经常回来待一会儿，即使每期并不提供惊天结论。
  triple_rule: 这期带来的笑、舒适或治愈明显超过日常消遣，甚至在看完后仍愿意想起或分享。
  compatible_secondary:
  - story
  - resonate
  - wonder
  - use
  - craft
  compatible_palettes:
  - warm_companion
  - energetic_fun
  - human_story
  - accessible_direct
  - wild_remix
- need_id: collect
  label: 深挖收藏
  motive: 你喜欢有人长期维护一口深井，补齐冷门材料、旧事物或专业细节；热门与否不会自动改变你的兴趣。
  follow_rule: 作者证明自己会持续整理一个值得长期积累的领域，而不是只来蹭一次冷门感。
  triple_rule: 这期拿出了罕见而扎实的材料，或完成了一次你很难在别处获得的整理与连接。
  compatible_secondary:
  - understand
  - identity
  - craft
  - use
  - challenge
  compatible_palettes:
  - archival_detail
  - calm_evidence
  - visual_mechanism
  - crafted_language
  - hands_on_case
