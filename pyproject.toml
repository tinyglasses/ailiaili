[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ailiaili"
version = "0.1.1"
description = "Entertainment-first AI creator ecology simulation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<2.1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
web = [
  "Pillow>=11,<13",
]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
ailiaili = "ailiaili.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ailiaili" = ["presets/*.yaml"]
"ailiaili.reports" = ["templates/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
